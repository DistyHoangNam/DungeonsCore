  Usage: "<#2A2A2A>[<#FF5555>&l!<#2A2A2A>] <#FF5555>Sử dụng: <#FFFFFF>/phoban check <tên_phòng>"
  Header: "<#00D4FF>[<#00FF88>&lSetup<#00D4FF>] <#FFFFFF>Phòng <#FFD700><room><#FFFFFF> — các mục chưa đủ (tối thiểu để mở cho người chơi):"
